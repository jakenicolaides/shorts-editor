<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts editor</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .intake { border: 1px solid rgba(127,127,127,.35); border-radius: 12px; padding: 16px; }
  .intake small { display: block; margin-top: 8px; color: #888; }
  .prep { border: 1px solid rgba(127,127,127,.35); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .prep label { margin-right: 8px; }
  .prep table { border-collapse: collapse; font-size: 13px; }
  .prep th, .prep td { padding: 4px 10px 4px 0; text-align: left; vertical-align: top; white-space: nowrap; }
  .prep th { color: #888; font-weight: 600; }
  .prep td.day { color: inherit; font-weight: 600; }
  .prep td small { display: block; color: #888; font-weight: 400; }
  .prep td.off { color: #888; }
  .prep td.off small { color: #a86; }
  .prep td.rec small { color: #2a7; }
  .speeds button { padding: 2px 8px; font-size: 13px; }
  .choices button.picked { background: #2a7; color: #fff; border-color: #2a7; }
  .drop { border: 2px dashed #999; border-radius: 12px; padding: 28px; text-align: center; color: #666; cursor: pointer; }
  .drop.over { border-color: #2a7; color: #2a7; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  select, input[type=number], button, textarea { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #aaa; background: transparent; color: inherit; }
  button.primary { background: #2a7; color: #fff; border-color: #2a7; }
  button:disabled { opacity: .5; }
  button.danger { color: #e74; border-color: #e74; margin-left: auto; }
  .jobs { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 800px) { .jobs { grid-template-columns: 1fr; } }
  .list a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: inherit; }
  .list a.sel, .list a:hover { background: rgba(127,127,127,.15); }
  .list small { color: #888; }
  .bar { height: 6px; background: rgba(127,127,127,.25); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: #2a7; width: 0; }
  video { width: 100%; max-width: 360px; aspect-ratio: 9/16; background: #000; border-radius: 12px; }
  .detail { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  @media (max-width: 800px) { .detail { grid-template-columns: 1fr; } }
  pre { font-size: 12px; background: rgba(127,127,127,.12); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .flag { display: inline-block; background: #e74; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 6px; }
  .hist { margin: 8px 0; padding: 8px 10px; border-left: 3px solid #2a7; background: rgba(127,127,127,.08); border-radius: 0 8px 8px 0; }
  .hist b { display: block; }
  textarea { width: 100%; min-height: 70px; box-sizing: border-box; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: #888; }
</style>
</head>
<body>
<h1>Shorts editor</h1>

<div class="intake" id="intake">
  <div class="row" style="margin:0 0 12px;justify-content:space-between">
    <span style="color:#888">Recording?</span><button id="prep-open">Prepare puzzles</button>
  </div>
  <div id="prep" class="prep" hidden>
    <div id="prep-list" style="color:#888;font-size:13px;margin:0 0 8px">Checking what is queued...</div>
    <div class="row"><button class="primary" id="prep-go">Open the ticked</button><button id="prep-close">Close</button>
      <label style="margin-left:auto;color:#888;font-size:13px">Chrome profile <select id="prep-profile"></select></label><span id="prep-msg" style="color:#888"></span></div>
  </div>
  <div class="drop" id="drop">Drop the raw clips here (one or several), or click to choose</div>
  <input type="file" id="file" accept="video/*" multiple hidden>
  <small>That is all: the game and the name are worked out from the clip, and it is cut at 1.0x. Change the speed or the name on the job afterwards.</small>
  <span id="upmsg" style="color:#e74"></span>
</div>

<div class="jobs">
  <div class="list" id="list"></div>
  <div id="detail"><p style="color:#888">Pick a job.</p></div>
</div>

<script>
const $ = s => document.querySelector(s);
let sel = null, jobs = [];

$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files.length) uploadAll([...e.target.files]); };
['dragenter','dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => { const fs = [...e.dataTransfer.files].filter(f => f.type.startsWith('video/') || /\.(mov|mp4|m4v|mkv)$/i.test(f.name)); if (fs.length) uploadAll(fs); });

// Several clips at once: uploaded one after another (the server queues the cutting too, so
// dropping a week's recordings is one gesture and the Mac works through them in turn).
async function uploadAll(files) {
  let first = null;
  for (let i = 0; i < files.length; i++) {
    const tag = files.length > 1 ? `${i + 1} of ${files.length}: ` : '';
    try {
      const id = await upload(files[i], p => { $('#upmsg').textContent = `uploading ${tag}${p}%`; });
      first = first || id;
    } catch (e) { $('#upmsg').textContent = `${files[i].name}: ${e.message}`; return; }
  }
  $('#upmsg').textContent = ''; $('#file').value = ''; sel = first; refresh();
}
function upload(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/upload?' + new URLSearchParams({ name: file.name }));
    xhr.upload.onprogress = e => onProgress(Math.round(100 * e.loaded / e.total));
    xhr.onload = () => { const r = JSON.parse(xhr.responseText); r.error ? reject(new Error(r.error)) : resolve(r.id); };
    xhr.onerror = () => reject(new Error('upload failed'));
    xhr.send(file);
  });
}
// Prepare puzzles: a checklist of every puzzle from yesterday on, labelled by when its video
// POSTS (that is how the recording is planned), the sensible ones ticked; one Chrome tab per tick.
let prepCands = [];
function prepDayLabel(d) {
  const dd = new Date(d + 'T12:00:00'), t = new Date(); t.setHours(12, 0, 0, 0);
  const diff = Math.round((dd - t) / 864e5);
  return (diff === -1 ? 'Yesterday' : diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : dd.toLocaleDateString('en-GB', { weekday: 'short' })) + ' ' + dd.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function prepDueLabel(iso) {
  const due = new Date(iso), t = new Date(); t.setHours(12, 0, 0, 0); const dd = new Date(due); dd.setHours(12, 0, 0, 0);
  const diff = Math.round((dd - t) / 864e5), when = diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : dd.toLocaleDateString('en-GB', { weekday: 'short' });
  return when + ' ' + due.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function prepRender() {
  const dates = [...new Set(prepCands.map(c => c.date))];
  const cols = [['twixtle', 'daily', 'Twixtle Daily'], ['twixtle', 'bonus', 'Twixtle Hard'], ['vowelsweeper', 'daily', 'Vowelsweeper Daily'], ['vowelsweeper', 'bonus', 'Vowelsweeper Hard']];
  $('#prep-list').innerHTML = `<table><tr><th>Puzzle of</th>${cols.map(c => `<th>${c[2]}</th>`).join('')}</tr>` + dates.map(d => `<tr><td class="day">${prepDayLabel(d)}</td>` + cols.map(([g, t]) => {
    const c = prepCands.find(x => x.game === g && x.track === t && x.date === d);
    if (!c) return '<td class="off">not queued</td>';
    const id = `${g}|${t}|${d}`;
    if (c.status === 'posted') return `<td class="off">missed<small>posted ${prepDueLabel(c.due_at)}</small></td>`;
    return `<td class="${c.status === 'recorded' ? 'rec' : ''}"><label><input type="checkbox" class="prep-pick" value="${id}" ${c.suggested ? 'checked' : ''}> ${c.status === 'recorded' ? 'again' : 'record'}</label><small>${c.status === 'recorded' ? 'recorded ✓ · ' : ''}posts ${prepDueLabel(c.due_at)}</small></td>`;
  }).join('') + '</tr>').join('') + '</table>';
  document.querySelectorAll('.prep-pick').forEach(c => c.onchange = prepCount);
  prepCount();
}
function prepPicks() { return [...document.querySelectorAll('.prep-pick:checked')].map(c => { const [game, track, date] = c.value.split('|'); return { game, track, date }; }); }
function prepCount() { const n = prepPicks().length; $('#prep-go').textContent = n ? `Open ${n} tab${n === 1 ? '' : 's'}` : 'Nothing ticked'; $('#prep-go').disabled = !n; }
$('#prep-open').onclick = async () => {
  const box = $('#prep'); box.hidden = !box.hidden; if (box.hidden) return;
  $('#prep-msg').textContent = ''; $('#prep-list').textContent = 'Checking what is queued...'; $('#prep-go').disabled = true;
  try {
    const r = await (await fetch('/prepare')).json();
    const sel = $('#prep-profile'), saved = localStorage.getItem('prepProfile');
    sel.innerHTML = (r.profiles || []).map(p => `<option value="${esc(p.dir)}" ${p.dir === saved ? 'selected' : ''}>${esc(p.name)}</option>`).join('') || '<option value="">default</option>';
    if (r.error) { $('#prep-list').textContent = r.error; return; }
    prepCands = r.candidates; prepRender();
  } catch (e) { $('#prep-list').textContent = 'Could not reach the posting app'; }
};
$('#prep-close').onclick = () => { $('#prep').hidden = true; };
$('#prep-go').onclick = async () => {
  const profile = $('#prep-profile').value; localStorage.setItem('prepProfile', profile);
  $('#prep-go').disabled = true; $('#prep-msg').textContent = 'Opening...';
  try {
    const r = await (await fetch('/prepare', { method: 'POST', body: JSON.stringify({ picks: prepPicks(), profile }) })).json();
    $('#prep-msg').textContent = r.error ? r.error : `Opened ${r.opened.length} tab${r.opened.length === 1 ? '' : 's'} in Chrome`;
  } catch (e) { $('#prep-msg').textContent = 'The server is not responding'; }
  prepCount();
};
// keep the server alive while this page is open; it quits when the pings stop
setInterval(() => fetch('/ping').catch(() => {}), 5000);
fetch('/ping').catch(() => {});
addEventListener('pagehide', () => navigator.sendBeacon('/bye'));

async function refresh() {
  jobs = await (await fetch('/jobs')).json();
  $('#list').innerHTML = jobs.map(j => {
    const st = j.status || {};
    const fin = j.cut ? Math.round(j.cut.final_duration) + 's' : '';
    return `<a href="#" data-id="${j.id}" class="${j.id === sel ? 'sel' : ''}">
      <div>${j.meta.title || j.meta.name || j.id} <small>${j.meta.speed}x</small></div>
      <small>${st.stage || ''} ${fin ? '· ' + fin : ''} ${st.error ? '· ' + st.error : ''}</small>
      <div class="bar"><i style="width:${st.progress || 0}%"></i></div></a>`;
  }).join('') || '<p style="color:#888">No jobs yet.</p>';
  document.querySelectorAll('.list a').forEach(a => a.onclick = e => { e.preventDefault(); sel = a.dataset.id; refresh(); });
  if (sel) showDetail();
}

const SPEEDS = [1.0, 1.1, 1.15, 1.2, 1.3, 1.5];
let shownJob = null, shownVersion = null, shownSig = null;
async function showDetail() {
  const r = await fetch('/jobs/' + sel);
  if (r.status === 404) { clearDetail(); return; }  // deleted
  const j = await r.json();
  const st = j.status || {}, side = j.sidecar || {}, cut = side.cut || {}, busy = !['review','failed','cancelled','approved','new'].includes(st.stage);
  const ver = (j.meta || {}).version || 0;
  const el = $('#detail');
  // The player lives in its own box and is only replaced when a new render lands,
  // otherwise redrawing the panel would restart playback every few seconds.
  if (shownJob !== sel) {
    el.innerHTML = '<div class="detail"><div id="vidbox"></div><div id="info"></div></div>';
    shownJob = sel; shownVersion = null; shownSig = null;
  }
  if (ver !== shownVersion) {
    $('#vidbox').innerHTML = ver ? `<video id="v" controls playsinline preload="metadata" src="/jobs/${sel}/video?v=${ver}"></video>` : `<div style="color:#888">Rendering...</div>`;
    shownVersion = ver;
  }
  const sig = JSON.stringify([(side.params || {}).speed, st.stage, st.progress, (st.log || []).length, (j.history || []).length, j.meta.saved_to, (j.meta.scheduled || {}).due_at, (j.meta.scheduled || {}).version, j.meta.too_large, cut.final_duration, j.meta.title, j.meta.title_suggested]);
  if (sig !== shownSig) {
    const noteDraft = el.querySelector('#note') ? el.querySelector('#note').value : '';
    const ttlDraft = el.querySelector('#ttl') && el.querySelector('#ttl').value !== el.querySelector('#ttl').defaultValue ? el.querySelector('#ttl').value : (j.meta.title || '');
    const named = (j.meta.title || '').length > 11;
    const openSections = [...el.querySelectorAll('details[open]')].map(d => d.dataset.k);
    $('#info').innerHTML = `
        <div><b>${j.meta.title || j.meta.name}</b> <small>${j.meta.title ? j.meta.name : ''}</small> · ${st.stage} ${busy ? '(working)' : ''}</div>
        <div class="bar" style="margin:6px 0 10px"><i style="width:${st.progress || 0}%"></i></div>
        ${(side.flags || []).map(f => `<span class="flag">${f}</span>`).join('')}
        ${cut.keep ? `<div class="kv">
          <span>final length</span><span>${fmt(cut.final_duration)} (${cut.keep.length} segments, ${fmt(cut.source_kept)} of ${fmt((side.probe||{}).duration)} kept)</span>
          <span>solve</span><span>${side.solve && side.solve.at != null ? fmt(side.solve.at) + ' (' + side.solve.game + ', score ' + side.solve.score + ')' : 'not detected'}</span>
          <span>loudness</span><span>${side.loudness_out ? side.loudness_out.input_i + ' LUFS, peak ' + side.loudness_out.input_tp + ' dBTP' : ''}</span>
          <span>gap</span><span>${(side.params||{}).max_gap}s</span>
        </div>
        <div class="row choices speeds"><span style="color:#888;font-size:13px">speed</span>
          ${SPEEDS.map(v => `<button data-speed="${v}" class="${+(side.params||{}).speed === v ? 'picked' : ''}" ${busy ? 'disabled' : ''}>${v}x</button>`).join('')}
          ${SPEEDS.includes(+(side.params||{}).speed) ? '' : `<button class="picked" disabled>${(side.params||{}).speed}x</button>`}
        </div>` : ''}
        ${!named && !busy ? `<div class="hist" style="border-color:#e74"><b>No name yet</b>${esc(j.meta.title_why ? 'Could not work it out from the clip: ' + j.meta.title_why + '.' : '')} Type it below (date, puzzle, daily or hard) to save.</div>` : ''}
        ${j.meta.title_suggested ? `<div class="hist" style="border-color:#27c"><b>The schedule has this puzzle as: ${esc(j.meta.title_suggested)}</b><button id="use-sugg" ${busy ? 'disabled' : ''}>Use this name</button></div>` : ''}
        <div class="row"><input type="text" id="ttl" value="${esc(ttlDraft)}" placeholder="2026-09-14 aye-hassle daily" style="width:260px" ${busy ? 'disabled' : ''}> <button id="ttl-save" ${busy ? 'disabled' : ''}>Rename</button></div>
        ${j.meta.saved_to ? `<div class="hist" style="border-color:#27c"><b>Saved to Dropbox</b>${esc(j.meta.saved_to.replace(/^.*CloudStorage\/Dropbox\//, 'Dropbox/'))}</div>` : ''}
        ${j.meta.too_large ? `<div class="hist" style="border-color:#e74"><b>Too large for the phone to share</b>Chrome caps shared files at 50 MB. Press Re-render: new renders are capped under it.</div>` : ''}
        ${j.meta.scheduled ? `<div class="hist" style="border-color:${j.meta.scheduled.version === ver ? '#27c' : '#e74'}"><b>${j.meta.scheduled.version === ver ? 'Scheduled to post' : 'Scheduled, but that was an earlier render'}</b>${new Date(j.meta.scheduled.due_at) <= new Date() ? 'It is due now: it is on the phone.' : 'Due ' + new Date(j.meta.scheduled.due_at).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + '.'}${j.meta.scheduled.version === ver ? '' : ' Approve again to replace it with this one.'}</div>` : ''}
        <h3 style="margin:16px 0 6px">Notes to the editor</h3>
        ${(j.history || []).map(h => `<div class="hist"><b>You: ${esc(h.note)}</b>Editor: ${esc(h.reply)}</div>`).join('')}
        <textarea id="note" placeholder="e.g. too choppy in the middle, and end a bit later after the solve" ${busy ? 'disabled' : ''}>${esc(noteDraft)}</textarea>
        <div class="row">
          <button id="send" ${busy ? 'disabled' : ''}>Send note</button>
          <button id="rerun" ${busy ? 'disabled' : ''}>${ver ? 'Re-render' : 'Try again'}</button>
          <button id="approve" class="primary" ${busy || !ver || !named ? 'disabled' : ''}>${j.poster ? (j.meta.scheduled ? 'Approve again (replaces it)' : 'Approve: save and schedule') : (j.meta.saved_to ? 'Save to Dropbox again' : 'Save to Dropbox')}</button>
          ${busy && st.stage !== 'saving' ? '<button id="cancel">Cancel</button>' : ''}
          <button id="delete" class="danger">Delete</button>
        </div>
        <details data-k="log"><summary>Log</summary><pre>${(st.log || []).join('\n')}</pre></details>
        <details data-k="cuts"><summary>Cut list</summary><pre>${(cut.keep || []).map(([s,e]) => fmt(s) + ' - ' + fmt(e)).join('\n')}</pre></details>`;
    shownSig = sig;
    el.querySelectorAll('details').forEach(d => { if (openSections.includes(d.dataset.k)) d.open = true; });
    $('#send').onclick = async () => { const n = $('#note').value.trim(); if (!n) return;
      if (await post('/jobs/' + sel + '/note', { note: n })) { $('#note').value = ''; } };
    $('#rerun').onclick = () => post('/jobs/' + sel + '/rerun');
    $('#approve').onclick = () => post('/jobs/' + sel + '/approve');
    el.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { if (!b.classList.contains('picked')) post('/jobs/' + sel + '/speed', { speed: +b.dataset.speed }); });
    $('#ttl').defaultValue = j.meta.title || '';
    $('#ttl-save').onclick = () => post('/jobs/' + sel + '/title', { title: $('#ttl').value.trim() });
    $('#ttl').addEventListener('keydown', e => { if (e.key === 'Enter') $('#ttl-save').click(); });
    if ($('#use-sugg')) $('#use-sugg').onclick = () => post('/jobs/' + sel + '/title', { title: j.meta.title_suggested });
    if ($('#cancel')) $('#cancel').onclick = () => post('/jobs/' + sel + '/cancel');
    $('#delete').onclick = async () => {
      const what = (busy ? 'Stop and delete' : 'Delete') + ' "' + (j.meta.title || j.meta.name) + '"?\n\nThis removes the raw copy, the transcript and the render from this Mac.'
        + (j.meta.saved_to ? ' The copy saved to Dropbox stays.' : ' It has not been saved to Dropbox.');
      if (!confirm(what)) return;
      if (await post('/jobs/' + sel, null, 'DELETE')) clearDetail();
    };
  }
  if (busy) setTimeout(showDetail, 1500);
}
function clearDetail() {
  sel = null; shownJob = null;
  $('#detail').innerHTML = '<p style="color:#888">Pick a job.</p>';
  refresh();
}
async function post(path, body, method) {
  let r;
  try { r = await fetch(path, { method: method || 'POST', body: body ? JSON.stringify(body) : null }); }
  catch (e) { alert('The server is not responding. Restart Shorts Editor.'); return false; }
  if (!r.ok) {
    const err = (await r.json().catch(() => ({}))).error;
    const stale = r.status === 501 || (r.status === 404 && err !== 'no such job');  // a route this server does not have
    alert(stale ? 'This button needs a newer server: close the Terminal window and open Shorts Editor again.' : (err || ('Failed: ' + r.status)));
    return false;
  }
  shownSig = null; refresh(); return true;
}
function fmt(s) { if (s == null) return '?'; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
refresh();
setInterval(() => { if (!sel || !document.querySelector('#note') || !['note', 'ttl'].includes(document.activeElement.id)) refresh(); }, 4000);
</script>
</body>
</html>
