<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts editor</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .intake { border: 1px solid rgba(127,127,127,.35); border-radius: 12px; padding: 16px; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
  .steps span { padding: 3px 10px; border-radius: 10px; background: rgba(127,127,127,.15); }
  .steps span.done { background: #2a7; color: #fff; cursor: pointer; }
  .steps span.cur { outline: 2px solid #2a7; }
  .step > label { display: block; font-weight: 600; margin-bottom: 8px; }
  .step small { color: #888; }
  .choices button.picked { background: #2a7; color: #fff; border-color: #2a7; }
  .drop { border: 2px dashed #999; border-radius: 12px; padding: 28px; text-align: center; color: #666; cursor: pointer; }
  .drop.over { border-color: #2a7; color: #2a7; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  select, input[type=number], button, textarea { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #aaa; background: transparent; color: inherit; }
  button.primary { background: #2a7; color: #fff; border-color: #2a7; }
  button:disabled { opacity: .5; }
  .jobs { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 800px) { .jobs { grid-template-columns: 1fr; } }
  .list a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: inherit; }
  .list a.sel, .list a:hover { background: rgba(127,127,127,.15); }
  .list small { color: #888; }
  .bar { height: 6px; background: rgba(127,127,127,.25); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: #2a7; width: 0; }
  video { width: 100%; max-width: 360px; aspect-ratio: 9/16; background: #000; border-radius: 12px; }
  .detail { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  @media (max-width: 800px) { .detail { grid-template-columns: 1fr; } }
  pre { font-size: 12px; background: rgba(127,127,127,.12); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .flag { display: inline-block; background: #e74; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 6px; }
  .hist { margin: 8px 0; padding: 8px 10px; border-left: 3px solid #2a7; background: rgba(127,127,127,.08); border-radius: 0 8px 8px 0; }
  .hist b { display: block; }
  textarea { width: 100%; min-height: 70px; box-sizing: border-box; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: #888; }
</style>
</head>
<body>
<h1>Shorts editor</h1>

<div class="intake" id="intake">
  <div class="steps" id="steps"></div>
  <div class="step" id="step-name">
    <label>1. Name the video</label>
    <div class="row"><input type="text" id="title" placeholder="2026-09-14 aye-hassle" style="width:260px"> <button class="primary" id="next-name">Next</button></div>
    <small>Date plus the puzzle. This becomes the file name in Dropbox.</small>
  </div>
  <div class="step" id="step-game" hidden>
    <label>2. Which game?</label>
    <div class="row choices" data-key="game">
      <button data-val="twixtle">Twixtle</button><button data-val="vowelsweeper">Vowelsweeper</button><button data-val="auto">Work it out from the solve sound</button>
    </div>
  </div>
  <div class="step" id="step-speed" hidden>
    <label>3. Speed</label>
    <div class="row choices" data-key="speed">
      <button data-val="1.0">1.0x</button><button data-val="1.1">1.1x</button><button data-val="1.15">1.15x</button><button data-val="1.2">1.2x</button><button data-val="1.3">1.3x</button><button data-val="1.5">1.5x</button>
    </div>
  </div>
  <div class="step" id="step-file" hidden>
    <label>4. The raw clip</label>
    <div class="drop" id="drop">Drop it here, or click to choose</div>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <span id="upmsg" style="color:#e74"></span>
</div>

<div class="jobs">
  <div class="list" id="list"></div>
  <div id="detail"><p style="color:#888">Pick a job.</p></div>
</div>

<script>
const $ = s => document.querySelector(s);
let sel = null, jobs = [];

const intake = { title: '', game: null, speed: null };
const STEPS = ['name', 'game', 'speed', 'file'];
let step = 0;

function resetIntake() {
  intake.title = ''; intake.game = null; intake.speed = null; step = 0;
  $('#title').value = new Date().toISOString().slice(0, 10) + ' ';
  document.querySelectorAll('.choices button').forEach(b => b.classList.remove('picked'));
  showStep();
}
function nameOk(t) { return t.length > 11 && !/^\d{4}-\d{2}-\d{2}$/.test(t); }
function showStep() {
  STEPS.forEach((k, i) => { $('#step-' + k).hidden = i !== step; });
  const labels = ['Name' + (intake.title ? ': ' + intake.title : ''), 'Game' + (intake.game ? ': ' + intake.game : ''),
                  'Speed' + (intake.speed ? ': ' + intake.speed + 'x' : ''), 'Clip'];
  $('#steps').innerHTML = labels.map((l, i) => `<span class="${i < step ? 'done' : ''} ${i === step ? 'cur' : ''}" data-i="${i}">${l}</span>`).join('');
  document.querySelectorAll('.steps span.done').forEach(sp => sp.onclick = () => { step = +sp.dataset.i; showStep(); });
  $('#upmsg').textContent = '';
  if (step === 0) $('#title').focus();
}
$('#next-name').onclick = () => {
  const t = $('#title').value.trim();
  if (!nameOk(t)) { $('#upmsg').textContent = 'Add the puzzle after the date, e.g. 2026-09-14 aye-hassle'; $('#title').focus(); return; }
  intake.title = t; step = 1; showStep();
};
$('#title').addEventListener('keydown', e => { if (e.key === 'Enter') $('#next-name').click(); });
document.querySelectorAll('.choices').forEach(box => {
  box.querySelectorAll('button').forEach(btn => btn.onclick = () => {
    box.querySelectorAll('button').forEach(b => b.classList.remove('picked')); btn.classList.add('picked');
    intake[box.dataset.key] = btn.dataset.val; step += 1; showStep();
  });
});
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files[0]) upload(e.target.files[0]); };
['dragenter','dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });

function upload(file) {
  if (!nameOk(intake.title) || !intake.game || !intake.speed) { step = 0; showStep(); $('#upmsg').textContent = 'Finish the steps first'; return; }
  const q = new URLSearchParams({ name: file.name, speed: intake.speed, game: intake.game, title: intake.title });
  const xhr = new XMLHttpRequest();
  xhr.open('PUT', '/upload?' + q);
  xhr.upload.onprogress = e => { $('#upmsg').textContent = 'uploading ' + Math.round(100 * e.loaded / e.total) + '%'; };
  xhr.onload = () => { const r = JSON.parse(xhr.responseText); if (r.error) { $('#upmsg').textContent = r.error; return; } sel = r.id; resetIntake(); refresh(); };
  xhr.onerror = () => { $('#upmsg').textContent = 'upload failed'; };
  xhr.send(file);
}
resetIntake();
// keep the server alive while this page is open; it quits when the pings stop
setInterval(() => fetch('/ping').catch(() => {}), 5000);
fetch('/ping').catch(() => {});
addEventListener('pagehide', () => navigator.sendBeacon('/bye'));

async function refresh() {
  jobs = await (await fetch('/jobs')).json();
  $('#list').innerHTML = jobs.map(j => {
    const st = j.status || {};
    const fin = j.cut ? Math.round(j.cut.final_duration) + 's' : '';
    return `<a href="#" data-id="${j.id}" class="${j.id === sel ? 'sel' : ''}">
      <div>${j.meta.title || j.meta.name || j.id} <small>${j.meta.speed}x</small></div>
      <small>${st.stage || ''} ${fin ? '· ' + fin : ''} ${st.error ? '· ' + st.error : ''}</small>
      <div class="bar"><i style="width:${st.progress || 0}%"></i></div></a>`;
  }).join('') || '<p style="color:#888">No jobs yet.</p>';
  document.querySelectorAll('.list a').forEach(a => a.onclick = e => { e.preventDefault(); sel = a.dataset.id; refresh(); });
  if (sel) showDetail();
}

let shownJob = null, shownVersion = null, shownSig = null;
async function showDetail() {
  const j = await (await fetch('/jobs/' + sel)).json();
  const st = j.status || {}, side = j.sidecar || {}, cut = side.cut || {}, busy = !['review','failed','approved','awaiting_review','new'].includes(st.stage);
  const ver = (j.meta || {}).version || 0;
  const el = $('#detail');
  // The player lives in its own box and is only replaced when a new render lands,
  // otherwise redrawing the panel would restart playback every few seconds.
  if (shownJob !== sel) {
    el.innerHTML = '<div class="detail"><div id="vidbox"></div><div id="info"></div></div>';
    shownJob = sel; shownVersion = null; shownSig = null;
  }
  if (ver !== shownVersion) {
    $('#vidbox').innerHTML = ver ? `<video id="v" controls playsinline preload="metadata" src="/jobs/${sel}/video?v=${ver}"></video>` : `<div style="color:#888">Rendering...</div>`;
    shownVersion = ver;
  }
  const sig = JSON.stringify([st.stage, st.progress, (st.log || []).length, (j.history || []).length, j.meta.review_link, j.meta.review_version, cut.final_duration]);
  if (sig !== shownSig) {
    const noteDraft = el.querySelector('#note') ? el.querySelector('#note').value : '';
    $('#info').innerHTML = `
        <div><b>${j.meta.title || j.meta.name}</b> <small>${j.meta.title ? j.meta.name : ''}</small> · ${st.stage} ${busy ? '(working)' : ''}</div>
        <div class="bar" style="margin:6px 0 10px"><i style="width:${st.progress || 0}%"></i></div>
        ${(side.flags || []).map(f => `<span class="flag">${f}</span>`).join('')}
        ${cut.keep ? `<div class="kv">
          <span>final length</span><span>${fmt(cut.final_duration)} (${cut.keep.length} segments, ${fmt(cut.source_kept)} of ${fmt((side.probe||{}).duration)} kept)</span>
          <span>solve</span><span>${side.solve && side.solve.at != null ? fmt(side.solve.at) + ' (' + side.solve.game + ', score ' + side.solve.score + ')' : 'not detected'}</span>
          <span>loudness</span><span>${side.loudness_out ? side.loudness_out.input_i + ' LUFS, peak ' + side.loudness_out.input_tp + ' dBTP' : ''}</span>
          <span>speed</span><span>${(side.params||{}).speed}x · gap ${(side.params||{}).max_gap}s</span>
        </div>` : ''}
        ${j.meta.review_link ? `<div class="hist" style="border-color:#27c"><b>Review link (v${j.meta.review_version}, ${st.stage === 'approved' ? 'approved' : st.stage === 'awaiting_review' ? 'waiting for the phone' : st.stage})</b><a href="${j.meta.review_link}" target="_blank">open review page</a> · <a href="#" id="copylink">copy link</a></div>` : ''}
        <h3 style="margin:16px 0 6px">Notes to the editor</h3>
        ${(j.history || []).map(h => `<div class="hist"><b>You: ${esc(h.note)}</b>Editor: ${esc(h.reply)}</div>`).join('')}
        <textarea id="note" placeholder="e.g. too choppy in the middle, and end a bit later after the solve" ${busy ? 'disabled' : ''}>${esc(noteDraft)}</textarea>
        <div class="row">
          <button id="send" ${busy ? 'disabled' : ''}>Send note</button>
          <button id="rerun" ${busy ? 'disabled' : ''}>Re-render</button>
          <button id="approve" class="primary" ${busy || !ver ? 'disabled' : ''}>Send for review on phone</button>
        </div>
        <details><summary>Log</summary><pre>${(st.log || []).join('\n')}</pre></details>
        <details><summary>Cut list</summary><pre>${(cut.keep || []).map(([s,e]) => fmt(s) + ' - ' + fmt(e)).join('\n')}</pre></details>`;
    shownSig = sig;
    $('#send').onclick = async () => { const n = $('#note').value.trim(); if (!n) return;
      await fetch('/jobs/' + sel + '/note', { method: 'POST', body: JSON.stringify({ note: n }) }); $('#note').value = ''; shownSig = null; refresh(); };
    $('#rerun').onclick = async () => { await fetch('/jobs/' + sel + '/rerun', { method: 'POST' }); shownSig = null; refresh(); };
    $('#approve').onclick = async () => { await fetch('/jobs/' + sel + '/review', { method: 'POST' }); shownSig = null; refresh(); };
    const cl = $('#copylink'); if (cl) cl.onclick = e => { e.preventDefault(); navigator.clipboard.writeText(j.meta.review_link); cl.textContent = 'copied'; };
  }
  if (busy) setTimeout(showDetail, 1500);
}
function fmt(s) { if (s == null) return '?'; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
refresh();
setInterval(() => { if (!sel || !document.querySelector('#note') || document.activeElement.id !== 'note') refresh(); }, 4000);
</script>
</body>
</html>
