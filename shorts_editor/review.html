<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review short</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; padding-bottom: 40px; max-width: 520px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  video { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 14px; margin: 12px 0; }
  .kv span:nth-child(odd) { color: #888; }
  .flag { display: inline-block; background: #e74; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 6px; }
  textarea { width: 100%; min-height: 90px; box-sizing: border-box; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #aaa; background: transparent; color: inherit; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center; font: inherit; font-weight: 600; padding: 14px; border-radius: 12px; border: 1px solid #aaa; background: transparent; color: inherit; margin-top: 10px; text-decoration: none; }
  button.primary, a.btn.primary { background: #2a7; color: #fff; border-color: #2a7; }
  button:disabled { opacity: .5; }
  .hist { margin: 8px 0; padding: 8px 10px; border-left: 3px solid #2a7; background: rgba(127,127,127,.08); border-radius: 0 8px 8px 0; font-size: 14px; }
  .hist b { display: block; }
  .msg { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: rgba(127,127,127,.12); font-size: 14px; }
  .done { background: #2a7; color: #fff; }
</style>
</head>
<body>
<h1 id="title">Loading...</h1>
<div id="app"></div>
<script>
const STATE_URL = "__STATE_URL__";
const DECISION_PUT_URL = "__DECISION_PUT_URL__";
const JOB_ID = "__JOB_ID__";
let state = null, sentVersion = null, sentAction = null;

function fmt(s) { if (s == null) return '?'; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function load() {
  try {
    const r = await fetch(STATE_URL, { cache: 'no-store' });
    const s = await r.json();
    if (!state || s.version !== state.version || s.updated !== state.updated) { state = s; render(); }
  } catch (e) { document.getElementById('title').textContent = 'Could not load (link expired?)'; }
}

function render() {
  const s = state;
  document.getElementById('title').textContent = s.name.replace('.mp4', '') + '  v' + s.version;
  const pending = sentVersion === s.version;
  document.getElementById('app').innerHTML = `
    <video controls playsinline preload="metadata" src="${s.video_url}"></video>
    <div class="kv">
      <span>length</span><span>${fmt(s.final_duration)} at ${s.speed}x</span>
      <span>solve</span><span>${s.solve && s.solve.at != null ? 'found (' + s.solve.game + ')' : 'not detected'}</span>
      <span>loudness</span><span>${s.loudness ? s.loudness.input_i + ' LUFS' : ''}</span>
    </div>
    ${(s.flags || []).map(f => `<span class="flag">${esc(f)}</span>`).join('')}
    ${(s.history || []).map(h => `<div class="hist"><b>You: ${esc(h.note)}</b>Editor: ${esc(h.reply)}</div>`).join('')}
    ${pending ? `<div class="msg ${sentAction === 'approve' ? 'done' : ''}">${sentAction === 'approve' ? 'Approved. Archiving on the Mac.' : 'Notes sent. The Mac is re-cutting; this page updates itself when the new version is up.'}</div>` : ''}
    <a class="btn primary" href="${s.download_url}" download>Download to phone</a>
    <button class="primary" id="approve" ${pending ? 'disabled' : ''}>Approve</button>
    <textarea id="note" placeholder="Notes for the editor, e.g. too choppy in the middle, end a bit later after the solve" ${pending ? 'disabled' : ''}></textarea>
    <button id="send" ${pending ? 'disabled' : ''}>Send notes and re-cut</button>`;
  document.getElementById('approve').onclick = () => decide('approve');
  document.getElementById('send').onclick = () => { const n = document.getElementById('note').value.trim(); if (n) decide('notes', n); };
}

async function decide(action, note) {
  const body = JSON.stringify({ action, note: note || null, version: state.version, at: Date.now() / 1000, job: JOB_ID });
  const r = await fetch(DECISION_PUT_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
  if (!r.ok) { alert('Could not send (' + r.status + ')'); return; }
  sentVersion = state.version; sentAction = action; render();
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
